services:
  - type: web
    name: ferramas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///ferramas.db
      - key: DIVISA_CACHE_SEGUNDOS
        value: "3600"
      - key: FLASK_DEBUG
        value: "false"
