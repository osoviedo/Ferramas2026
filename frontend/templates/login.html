{% extends "base.html" %}
{% block content %}

<section class="hero">
    <h1>Iniciar sesión</h1>
    <p>Accede a tu cuenta de Ferremas</p>
</section>

<div style="max-width:420px; margin:0 auto; padding: 0 16px 40px;">
    <form method="POST" id="login-form" style="background:rgba(255,255,255,0.07); border:0.5px solid rgba(255,255,255,0.15); border-radius:14px; padding:32px; backdrop-filter:blur(10px);">
        <input type="hidden" name="items_carrito" id="items-carrito" value="">
        <div class="mb-3">
            <label for="email" class="form-label text-white" style="font-size:13px;">Email</label>
            <input type="email" class="form-control" id="email" name="email" required
                   style="background:rgba(255,255,255,0.08); border:0.5px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:10px 14px;">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label text-white" style="font-size:13px;">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required
                   style="background:rgba(255,255,255,0.08); border:0.5px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:10px 14px;">
        </div>
        <button type="submit" class="btn w-100" style="background:#e8601a; color:#fff; font-weight:500; border-radius:8px; padding:10px;">
            <i class="ti ti-login"></i> Ingresar
        </button>
        <p class="text-center mt-3 mb-0" style="font-size:13px; color:rgba(255,255,255,0.5);">
            ¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" style="color:#e8601a; text-decoration:none;">Regístrate</a>
        </p>
    </form>
</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', function() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let itemsParaBD = carrito.map(p => ({ id: p.id, cantidad: p.cantidad }));
    document.getElementById("items-carrito").value = JSON.stringify(itemsParaBD);
});
</script>
{% endblock %}
