{% extends "base.html" %}
{% block content %}

<section class="hero">
    <h1>Registrarse</h1>
    <p>Crea tu cuenta en Ferremas</p>
</section>

<div style="max-width:420px; margin:0 auto; padding: 0 16px 40px;">
    <form method="POST" style="background:rgba(255,255,255,0.07); border:0.5px solid rgba(255,255,255,0.15); border-radius:14px; padding:32px; backdrop-filter:blur(10px);">
        <div class="mb-3">
            <label for="nombre" class="form-label text-white" style="font-size:13px;">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required
                   style="background:rgba(255,255,255,0.08); border:0.5px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:10px 14px;">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label text-white" style="font-size:13px;">Email</label>
            <input type="email" class="form-control" id="email" name="email" required
                   style="background:rgba(255,255,255,0.08); border:0.5px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:10px 14px;">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label text-white" style="font-size:13px;">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required minlength="6"
                   style="background:rgba(255,255,255,0.08); border:0.5px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:10px 14px;">
        </div>
        <div class="mb-3">
            <label for="confirmar" class="form-label text-white" style="font-size:13px;">Confirmar contraseña</label>
            <input type="password" class="form-control" id="confirmar" name="confirmar" required minlength="6"
                   style="background:rgba(255,255,255,0.08); border:0.5px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px; padding:10px 14px;">
        </div>
        <button type="submit" class="btn w-100" style="background:#e8601a; color:#fff; font-weight:500; border-radius:8px; padding:10px;">
            <i class="ti ti-user-plus"></i> Crear cuenta
        </button>
        <p class="text-center mt-3 mb-0" style="font-size:13px; color:rgba(255,255,255,0.5);">
            ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" style="color:#e8601a; text-decoration:none;">Inicia sesión</a>
        </p>
    </form>
</div>

{% endblock %}
