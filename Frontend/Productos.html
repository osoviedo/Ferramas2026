<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramas - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="content">

    <!-- NAVBAR -->
    <nav class="nav-bar">
        <div class="logo">
            <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
                <div class="logo-box">
                    <i class="ti ti-hammer"></i>
                </div>
                <div>
                    <div class="logo-text">FERREMAS</div>
                    <div class="logo-sub">Tu ferretería de confianza</div>
                </div>
            </a>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-login">
                <i class="ti ti-arrow-left"></i>
                Volver
            </a>
            <a href="login.html" class="btn-login">
                <i class="ti ti-user"></i>
                Iniciar sesión
            </a>
            <a href="carrito.html" class="btn-login">
                <i class="ti ti-shopping-cart"></i>
                <span id="contador-carrito">0</span>
            </a>
        </div>
    </nav>

    <!-- TÍTULO DE CATEGORÍA -->
    <section class="hero" style="padding: 32px 32px 16px;">
        <h1 id="titulo-categoria">Cargando...</h1>
        <p id="subtitulo-categoria">Encuentra los mejores productos</p>
    </section>

    <!-- LOADING -->
    <div id="loading" style="text-align:center; padding: 40px; color: rgba(255,255,255,0.6);">
        <i class="ti ti-loader" style="font-size:32px;"></i>
        <p style="margin-top:8px;">Cargando productos...</p>
    </div>

    <!-- ERROR -->
    <div id="error" style="display:none; text-align:center; padding: 40px; color: rgba(255,100,100,0.8);">
        <i class="ti ti-alert-circle" style="font-size:32px;"></i>
        <p style="margin-top:8px;">No se pudieron cargar los productos.<br>Verifica que la API esté corriendo.</p>
    </div>

    <!-- GRID DE PRODUCTOS -->
    <section class="productos-grid" id="contenedor-productos"></section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">Inicio</a>
            <a href="Productos.html">Productos</a>
            <a href="suscripcion.html">Suscripción</a>
            <a href="contacto.html">Contacto</a>
        </div>
        <div class="footer-social">
            <i class="ti ti-brand-instagram"></i>
            <i class="ti ti-brand-facebook"></i>
            <i class="ti ti-brand-twitter"></i>
            <i class="ti ti-brand-youtube"></i>
        </div>
    </footer>

</div>

<script>

    // ── Leer categoría desde la URL ──
    const params        = new URLSearchParams(window.location.search)
    const categoriaURL  = params.get("categoria") || ""
    const categoriaNombre = categoriaURL.replace(/-/g, " ")

    // ── Capitalizar primera letra ──
    function capitalizar(str) {
        return str.charAt(0).toUpperCase() + str.slice(1)
    }

    // ── Actualizar título ──
    document.getElementById("titulo-categoria").textContent = capitalizar(categoriaNombre)

    // ── Cargar productos desde la API ──
    fetch(`http://127.0.0.1:5000/productos/categoria/${categoriaURL}`)
        .then(response => {
            if (!response.ok) throw new Error("Error en la API")
            return response.json()
        })
        .then(data => {

            document.getElementById("loading").style.display = "none"

            const contenedor = document.getElementById("contenedor-productos")

            if (data.length === 0) {
                contenedor.innerHTML = `
                    <div style="text-align:center; padding:40px; color:rgba(255,255,255,0.5); grid-column: 1/-1;">
                        <i class="ti ti-package-off" style="font-size:40px;"></i>
                        <p style="margin-top:12px;">No hay productos en esta categoría.</p>
                    </div>`
                return
            }

            data.forEach(producto => {
                // Ruta de imagen relativa al Frontend
                const imgSrc = `${producto.imagen}`

                contenedor.innerHTML += `
                    <div class="producto-card">
                        <div class="producto-imagen">
                            <img src="${imgSrc}"
                                 alt="${producto.nombre}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="producto-icono-fallback" style="display:none;">
                                <i class="ti ti-package" style="font-size:32px; color:rgba(255,255,255,0.3);"></i>
                            </div>
                        </div>
                        <h3>${producto.nombre}</h3>
                        <p class="producto-precio">$${producto.precio.toLocaleString("es-CL")}</p>
                        <p class="producto-stock">
                            <i class="ti ti-package" style="font-size:13px;"></i>
                            Stock: ${producto.stock} unidades
                        </p>
                        <button class="btn-agregar" onclick="agregarAlCarrito(${producto.id}, '${producto.nombre}', ${producto.precio}, this)">
                            <i class="ti ti-shopping-cart-plus"></i>
                            Agregar al carrito
                        </button>
                    </div>`
            })
        })
        .catch(() => {
            document.getElementById("loading").style.display = "none"
            document.getElementById("error").style.display   = "block"
        })

    // ── Carrito básico (localStorage) ──
    function agregarAlCarrito(id, nombre, precio, btn) {
        let carrito = JSON.parse(localStorage.getItem("carrito")) || []

        const existe = carrito.find(p => p.id === id)
        if (existe) {
            existe.cantidad++
        } else {
            carrito.push({ id, nombre, precio, cantidad: 1 })
        }

        localStorage.setItem("carrito", JSON.stringify(carrito))
        actualizarContador()

        // Feedback visual al botón
        btn.innerHTML = `<i class="ti ti-check"></i> Agregado`
        setTimeout(() => {
            btn.innerHTML = `<i class="ti ti-shopping-cart-plus"></i> Agregar al carrito`
        }, 1500)
    }

    function actualizarContador() {
        let carrito = JSON.parse(localStorage.getItem("carrito")) || []
        const total = carrito.reduce((acc, p) => acc + p.cantidad, 0)
        document.getElementById("contador-carrito").textContent = total
    }

    actualizarContador()

</script>

</body>
</html>
